<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TiebaLite · iOS 悬浮栏布局示意</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e8ebef;font-family:system-ui,sans-serif;color:#151515;padding:16px}p.note{max-width:390px;margin:0 auto 12px;font-size:12px;line-height:1.5;color:#555}.phone{position:relative;width:100%;max-width:390px;height: min(844px,calc(100dvh - 85px));min-height:560px;margin:auto;overflow:hidden;border-radius:28px;background:#f2f2f7;box-shadow:0 10px 40px #0002}.feed{position:absolute;inset:0;overflow-y:auto;padding:115px 10px 130px;scrollbar-width:thin}.card{margin-bottom:12px;padding:18px 16px;border-radius:18px;background:white;line-height:1.6}.card h2{font-size:18px;margin:12px 0}.card p{margin:10px 0;color:#717177;font-size:15px}.author{font-size:14px;font-weight:600}.author small{display:block;color:#8a8a90;font-weight:400}.picture{height:150px;border-radius:12px;background:#b8c9cc;display:grid;place-items:center;color:#526e74;font-size:32px}.card:nth-child(2) .picture{background:#d9c6a5;color:#7a6449}.card:nth-child(3) .picture{background:#b7c9b7;color:#4d6b53}.counts{display:flex;justify-content:space-around;font-size:13px;color:#929298;margin-top:18px}.top{position:absolute;inset:0 0 auto;height:105px;background:#f6fbff88;backdrop-filter:blur(22px) saturate(1.5);-webkit-backdrop-filter:blur(22px) saturate(1.5);border-bottom:1px solid #fff5}.status{height:44px;padding:10px 22px;font-size:14px;font-weight:600;display:flex;justify-content:space-between}.nav{height:61px;display:flex;justify-content:center;align-items:center;position:relative;font-size:18px;font-weight:600}.search{position:absolute;right:16px;top:7px;width:44px;height:44px;border:1px solid #ffffffa0;border-radius:50%;background:#ffffff55;display:grid;place-items:center;color:#111}.search svg{width:24px;height:24px;stroke:currentColor;stroke-width:2.5;fill:none}.tabs{position:absolute;bottom:30px;left:50%;transform:translateX(-50%);width:min(280px,calc(100% - 40px));display:flex;padding:4px;border-radius:99px;background:#f5ffff55;backdrop-filter:blur(20px) saturate(1.6);-webkit-backdrop-filter:blur(20px) saturate(1.6);border:1px solid #fffc;box-shadow:0 8px 20px #0002}.tabs button{flex:1;min-height:54px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:3px;padding:4px;border:0;border-radius:99px;color:#111;background:transparent;font:600 11px system-ui}.tabs button[aria-pressed=true]{color:#008cff;background:#00000012}.tabs svg{width:25px;height:25px;fill:currentColor}.home-indicator{position:absolute;bottom:9px;left:50%;transform:translateX(-50%);width:124px;height:5px;background:#111;border-radius:9px;pointer-events:none}button{cursor:pointer}button:focus-visible{outline:3px solid #008cff;outline-offset:2px}
</style>
<p class="note">iOS 新布局示意，可滚动查看底栏下方内容。示例内容用于对照样式；非 iOS 运行画面。</p>
<div class="phone">
 <main class="feed" aria-label="延伸到屏幕底部的示例内容">
  <article class="card"><div class="author">日常记录吧<small>示例用户 · 刚刚</small></div><h2>今天有什么值得记录的小事？</h2><p>把普通的一天写下来，也会发现不少值得记住的瞬间。</p><div class="picture" aria-hidden="true">☀︎</div><div class="counts"><span>评论 17</span><span>点赞 68</span></div></article>
  <article class="card"><div class="author">周末出行吧<small>示例用户 · 10分钟前</small></div><h2>周末出门走走</h2><p>选一条熟悉的小路，慢慢走到傍晚。滚动时，内容从玻璃顶栏和悬浮胶囊下方经过。</p><div class="picture" aria-hidden="true">⌁</div><div class="counts"><span>评论 50</span><span>点赞 158</span></div></article>
  <article class="card"><div class="author">摄影吧<small>示例用户 · 20分钟前</small></div><h2>留下窗外的一点绿色</h2><p>底栏下方仍然展示内容，没有整块不透明的底色。</p><div class="picture" aria-hidden="true">♧</div><div class="counts"><span>评论 12</span><span>点赞 83</span></div></article>
 </main>
 <header class="top"><div class="status"><span>12:46</span><span>5G　83%</span></div><div class="nav"><span id="title">首页</span><button class="search" aria-label="搜索样式示意"><svg viewBox="0 0 24 24"><circle cx="10" cy="10" r="6.5"/><path d="m15 15 6 6"/></svg></button></div></header>
 <nav class="tabs" aria-label="底栏样式示意">
  <button aria-pressed="true" data-title="首页"><svg viewBox="0 0 24 24"><path d="M2 10 12 1l10 9-2 2-1-1v11h-5v-7h-4v7H5V11l-1 1z"/></svg>首页</button>
  <button aria-pressed="false" data-title="进吧"><svg viewBox="0 0 24 24"><rect x="2" y="2" width="9" height="9" rx="2"/><rect x="13" y="2" width="9" height="9" rx="2"/><rect x="2" y="13" width="9" height="9" rx="2"/><rect x="13" y="13" width="9" height="9" rx="2"/></svg>进吧</button>
  <button aria-pressed="false" data-title="我的"><svg viewBox="0 0 24 24"><path fill-rule="evenodd" d="M12 0a12 12 0 1 0 0 24 12 12 0 0 0 0-24m0 4a4 4 0 1 1 0 8 4 4 0 0 1 0-8m-7 15a7 6 0 0 1 14 0z"/></svg>我的</button>
 </nav><div class="home-indicator" aria-hidden="true"></div>
</div>
<script>document.querySelectorAll('.tabs button').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('.tabs button').forEach(item=>item.setAttribute('aria-pressed',String(item===button)));document.getElementById('title').textContent=button.dataset.title;}));document.querySelector('.search').addEventListener('click',()=>{document.getElementById('title').textContent='搜索样式示意';});</script>
</html>
