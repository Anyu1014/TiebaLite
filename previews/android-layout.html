<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TiebaLite · Android 原生布局</title>
<style>
:root{font-family:system-ui,sans-serif;color-scheme:light dark}body{margin:0;padding:16px;color:light-dark(#171719,#eee);background:light-dark(#f0f1f4,#17191d)}h1{font-size:18px;margin:0 0 8px}p{font-size:12px;line-height:1.5;margin:0 0 12px;opacity:.75}nav{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}button{font:inherit;font-size:13px;padding:8px 12px;color:inherit;background:transparent;border:1px solid #8887;border-radius:8px;cursor:pointer}button[aria-pressed=true]{background:#007aff;color:white;border-color:#007aff}img{display:block;width:100%;max-width:440px;margin:auto;border-radius:12px;box-shadow:0 8px 28px #0002}button:focus-visible{outline:2px solid #007aff;outline-offset:2px}
</style>
<h1>Android · iOS 布局 / Anyu 磨砂</h1>
<p>本机 Android 35 模拟器的实际运行截图（2026-10-26）。按钮切换截图，页面不是原生应用的远程控制窗口。</p>
<nav aria-label="查看页面">
<button data-view="home" aria-pressed="true">首页</button><button data-view="scrolled" aria-pressed="false">滚动后</button><button data-view="forums" aria-pressed="false">进吧</button><button data-view="me" aria-pressed="false">我的</button><button data-view="settings" aria-pressed="false">设置</button><button data-view="reading-settings" aria-pressed="false">阅读设置</button><button data-view="thread" aria-pressed="false">帖子</button><button data-view="dark-me" aria-pressed="false">深色</button>
</nav>
<img id="screen" src="android-new-home.png" alt="Android 原生首页实际运行截图">
<script>document.querySelectorAll('button').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('button').forEach(item=>item.setAttribute('aria-pressed',String(item===button)));const screen=document.getElementById('screen');screen.src='android-new-'+button.dataset.view+'.png';screen.alt='Android 原生'+button.textContent+'实际运行截图';}));</script>
</html>
