<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TiebaLite 双端预览</title>
<style>
:root{color-scheme:light dark;font-family:system-ui,sans-serif}body{margin:0;padding:24px;background:light-dark(#f4f5f7,#17191d);color:light-dark(#17202a,#eee)}header{display:flex;gap:20px;align-items:center;flex-wrap:wrap}h1{font-size:22px}button{font:inherit;padding:8px 16px;border:1px solid #888;border-radius:8px;background:transparent;color:inherit;cursor:pointer}button[aria-pressed=true]{background:#087acb;color:white;border-color:#087acb}main{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;margin-top:20px}h2{font-size:18px;margin:0 0 8px}p{font-size:13px;line-height:1.5;min-height:40px;opacity:.8}img{display:block;width:100%;max-width:390px;height:auto;border-radius:18px;box-shadow:0 8px 28px #0002}section{min-width:0}@media(max-width:440px){body{padding:12px}main{gap:12px}h2{font-size:15px}p{font-size:12px}}
</style>
<header><h1>TiebaLite · 双端预览</h1><nav aria-label="预览页面"><button aria-pressed="true" data-view="home">首页</button> <button aria-pressed="false" data-view="thread">帖子</button></nav></header>
<main><section><h2>iOS · 界面参考</h2><p>原项目界面截图；本机尚无 iOS 模拟器运行时，非当前运行画面。</p><img id="ios" src="ios-home.png" alt="iOS 首页参考截图"></section><section><h2>Android · 模拟器截图</h2><p>Android 35 实际运行截图：10/25 首页、10/26 最终 Release 帖子。静态截图，非交互模拟器。</p><img id="android" src="android-home.png" alt="Android 首页运行截图"></section></main>
<script>document.querySelectorAll('button').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('button').forEach(item=>item.setAttribute('aria-pressed',String(item===button)));for(const platform of ['ios','android']){const image=document.getElementById(platform);image.src=platform+'-'+button.dataset.view+'.png';image.alt=platform+' '+button.textContent+'截图';}}));</script>
</html>
